name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Razvojni alat traži više od objavljenih paketa: rolldown (kroz vitest)
        # traži Node >= 20.19, a paketi samo >= 20.10. Ovdje se vrti alat; donja
        # granica onoga što KORISNIK treba provjerava se u poslu "runtime-floor".
        node: ["20.19", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit testovi ne smiju trebati validacione artefakte - oni nastaju tek uz
      # prepare:sef, koji traži mrežu. Testovi koji stvarno izvršavaju
      # Schematron su u test/integration i vrte se u e2e poslu.
      - name: Unit testovi
        run: npm test

      - name: Build paketa
        run: npm run build

  # SEF kompajliranje je sporo (~1 min) i traži mrežu, pa ide u zaseban posao
  # s cacheom po verziji CEN artefakata.
  e2e:
    name: End-to-end validacija
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Odredi verziju CEN artefakata
        id: cen
        run: echo "tag=$(grep -oE 'validation-[0-9.]+' scripts/build-sef.mjs | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache SEF fajlova
        id: sef-cache
        uses: actions/cache@v4
        with:
          path: |
            packages/core/sef
            packages/cius-hr/sef
          key: sef-${{ steps.cen.outputs.tag }}-${{ hashFiles('scripts/build-sef.mjs') }}

      - name: Pripremi SEF
        if: steps.sef-cache.outputs.cache-hit != 'true'
        run: npm run prepare:sef

      - run: npm run build

      - name: Provjeri validacione artefakte
        run: node scripts/verify-artefacts.mjs

      - name: Integracijski testovi
        run: npm run test:integration

      - name: Validiraj kontrolne fakture
        run: node scripts/e2e.mjs

      - name: Round-trip (build -> validate)
        run: node scripts/roundtrip.mjs

  # Objavljeni paketi tvrde engines >= 20.10 zbog `import ... with { type: "json" }`.
  # Tu tvrdnju ne moze provjeriti glavna matrica jer njen alat trazi noviji Node,
  # pa se ovdje pokrece samo izgradjeni kod, bez vitesta.
  runtime-floor:
    name: Najniza podrzana Node verzija
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.10"

      - name: Instaliraj bez razvojnih zavisnosti alata
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Paketi se ucitavaju i builder radi
        run: node scripts/smoke.mjs

  artefacts:
    name: Provjera novih artefakata
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Ima li noviji CEN release od pinovanog
        run: |
          PINNED=$(grep -oE 'validation-[0-9.]+' scripts/build-sef.mjs | head -1)
          LATEST=$(git ls-remote --tags --refs \
            https://github.com/ConnectingEurope/eInvoicing-EN16931.git \
            | awk -F/ '{print $NF}' | grep '^validation-' | sort -V | tail -1)
          echo "pinovano: $PINNED | zadnje: $LATEST"
          if [ "$PINNED" != "$LATEST" ]; then
            echo "::warning title=Novi CEN release::$LATEST (pinovano $PINNED) - treba update i regresijski test."
          fi
