name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Izuzeće ide po nalogu koji je otvorio PR: email u commitu postavlja autor sam.
      - name: Provjeri potpis svakog commita
        if: ${{ !contains(fromJSON('["jasenkoh", "dependabot[bot]"]'), github.event.pull_request.user.login) }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" | grep -qiE "^Signed-off-by: .+ <.+>$"; then
              echo "::error title=Nema Signed-off-by::$sha ($email): $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Dodaj potpis: git commit --amend -s (ili git rebase --signoff $BASE)."
            exit 1
          fi
