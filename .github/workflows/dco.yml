name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Vlasnikovi commitovi su izuzeti samo u PR-u koji je otvorio vlasnik: email u
      # commitu autor postavlja sam, nalog koji otvara PR ne može lažirati.
      - name: Provjeri potpis svakog commita
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            if [ "$OPENER" = jasenkoh ] && [ "$email" = jasenko@outlook.com ]; then
              echo "izuzet (vlasnik): $sha"
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -qiE "^Signed-off-by: .+ <.+>$"; then
              echo "::error title=Nema Signed-off-by::$sha ($email): $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Dodaj potpis: git commit --amend -s (ili git rebase --signoff $BASE)."
            exit 1
          fi
