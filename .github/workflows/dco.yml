name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Vlasnik i botovi su izuzeti; svaki drugi autor potvrđuje DCO (CONTRIBUTING.md).
      - name: Provjeri potpis svakog commita
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            case "$email" in
              jasenko@outlook.com|*\[bot\]@users.noreply.github.com) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -qiE "^Signed-off-by: .+ <.+>$"; then
              echo "::error title=Nema Signed-off-by::$sha ($email): $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Dodaj potpis: git commit --amend -s (ili git rebase --signoff $BASE)."
            exit 1
          fi
