name: Release

# Dva načina pokretanja:
#
#  1. Actions -> Release -> Run workflow -> odaberi patch/minor/major
#     Pipeline sam podigne verziju, commita, tagira i objavi. Ništa lokalno.
#
#  2. push taga v* (npr. ako verziju dižeš ručno)
#
# Objava ide preko npm trusted publishing (OIDC) - bez tokena u secrets.
#
# BOOTSTRAP: trusted publisher se podešava na stranici paketa, a stranica
# postoji tek kad paket postoji. Za prvu objavu zato postoji privremeni izlaz:
# ako u repo secrets postaviš NPM_TOKEN, workflow će ga upotrijebiti.
# Nakon prve uspješne objave: podesi trusted publishing za sva četiri paketa,
# obriši secret i opozovi token - OIDC dalje radi sam.
#
# Token za bootstrap mora imati:
#   - opseg "All packages" (unscoped `verifaktura` nije u scope-u @verifaktura)
#   - uključen "Bypass two-factor authentication"
#
# Postavljanje je opisano u RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Koliko podići verziju"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Samo provjeri, bez objave"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write   # za commit i tag pri workflow_dispatch
  id-token: write   # obavezno za OIDC objavu

concurrency:
  group: release
  cancel-in-progress: false   # objavu nikad ne prekidati usred posla

jobs:
  release:
    runs-on: ubuntu-latest   # self-hosted runneri nisu podržani za OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"           # trusted publishing traži Node >= 22.14
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # bez cachea u release buildu

      - run: npm ci

      # --- provjere prije bilo kakve promjene verzije ---
      - run: npm run typecheck
      - run: npm test

      - name: Pripremi validacione artefakte
        run: npm run prepare:sef

      - run: npm run build

      - name: Validiraj kontrolne fakture
        run: node scripts/e2e.mjs

      - name: Round-trip (build -> validate)
        run: node scripts/roundtrip.mjs

      # --- podizanje verzije (samo pri ručnom pokretanju) ---
      # Commit i tag se prave LOKALNO; na remote idu tek nakon uspješne objave.
      # Inače neuspjela objava ostavi podignutu verziju na main-u, pa se broj
      # potroši a paket nikad ne izađe (tako smo prošli 0.1.1 do 0.1.3).
      - name: Podigni verziju, commitaj i tagiraj (lokalno)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/version.mjs "${{ inputs.bump }}"
          npm install --package-lock-only --ignore-scripts
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git add -A
          git commit -m "release: v${VERSION}"
          # anotirani tag: --follow-tags ignoriše lightweight tagove
          git tag -a "v${VERSION}" -m "verifaktura v${VERSION}"

      - name: Odredi verziju
        id: v
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      # --- objava ---
      - name: Odredi način autentifikacije i provenance
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::warning title=Bootstrap objava::Koristi se NPM_TOKEN. Nakon uspjeha podesi trusted publishing, obriši secret i opozovi token."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi

          # Provenance radi ISKLJUČIVO iz javnih repozitorija. Iz privatnog npm
          # odbija objavu s E422 ("Unsupported ... source repository
          # visibility"), i to tek NAKON što je paket već potpisan - pa se bez
          # ove provjere gubi cijeli prolaz.
          if [ "$VISIBILITY" = "public" ]; then
            echo "provenance=yes" >> "$GITHUB_OUTPUT"
          else
            echo "provenance=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=Bez provenance::Repozitorij je \"$VISIBILITY\". Paketi se objavljuju bez provenance potpisa. Prebaci repo na public pa ponovi objavu da bi ga dobili."
          fi

      # Provenance: kod trusted publishinga se generiše sam (pa se --provenance
      # ne navodi), kod objave tokenom se traži eksplicitno. U oba slučaja se
      # gasi ako repozitorij nije javan.
      - name: Objavi pakete
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # gasi automatski provenance kod OIDC-a iz privatnog repoa
          NPM_CONFIG_PROVENANCE: ${{ steps.auth.outputs.provenance == 'yes' }}
        run: |
          PUBLISH_ARGS=""
          if [ "${{ steps.auth.outputs.mode }}" = "token" ]; then
            PUBLISH_ARGS="--access public"
            if [ "${{ steps.auth.outputs.provenance }}" = "yes" ]; then
              PUBLISH_ARGS="$PUBLISH_ARGS --provenance"
            fi
          fi
          FAILED=""
          for dir in packages/core packages/build packages/cius-hr packages/cli; do
            name="$(node -p "require('./$dir/package.json').name")"
            echo "::group::npm publish $name"
            if (cd "$dir" && npm publish $PUBLISH_ARGS); then
              echo "$name objavljen"
            else
              echo "::error title=Objava nije uspjela::$name"
              FAILED="$FAILED $name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "Nisu objavljeni:$FAILED"
            exit 1
          fi

      - name: Objavi commit i tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          # push s GITHUB_TOKEN ne pokreće ponovo ovaj workflow
          git push origin HEAD:${GITHUB_REF_NAME} --follow-tags

      # GitHub Release je prvo što se gleda pri procjeni je li projekat živ.
      # Bilješke se generišu iz commitova od prethodnog taga.
      - name: Napravi GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          {
            echo "### Objavljeni paketi"
            echo
            for pkg in verifaktura @verifaktura/build @verifaktura/cius-hr @verifaktura/cli; do
              echo "- [\`$pkg@${VERSION}\`](https://www.npmjs.com/package/${pkg}/v/${VERSION})"
            done
            echo
            echo "\`\`\`bash"
            echo "npm install verifaktura@${VERSION}"
            echo "\`\`\`"
          } > "$NOTES_FILE"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} već postoji, preskačem."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes \
              --verify-tag
          fi

      - name: Sažetak
        run: |
          {
            echo "## verifaktura v${{ steps.v.outputs.version }}"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Probni prolaz — ništa nije objavljeno."
            else
              echo "Objavljeno na npm (autentifikacija: ${{ steps.auth.outputs.mode }}, provenance: ${{ steps.auth.outputs.provenance }}):"
              echo "- verifaktura"
              echo "- @verifaktura/build"
              echo "- @verifaktura/cius-hr"
              echo "- @verifaktura/cli"
              if [ "${{ steps.auth.outputs.mode }}" = "token" ]; then
                echo
                echo "### Sljedeći korak"
                echo "Podesi trusted publishing za sva četiri paketa, obriši \`NPM_TOKEN\` secret i opozovi token."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
