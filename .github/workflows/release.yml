name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Pripremi SEF (ulaze u objavljeni paket)
        run: npm run prepare:sef

      - run: npm run build

      - name: Objavi verifaktura
        run: npm publish --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Objavi @verifaktura/build
        run: npm publish --access public --provenance
        working-directory: packages/build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Objavi @verifaktura/cli
        run: npm publish --access public --provenance
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Objavi @verifaktura/cius-hr
        run: npm publish --access public --provenance
        working-directory: packages/cius-hr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
